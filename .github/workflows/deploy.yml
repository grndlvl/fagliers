name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One production deploy at a time; let in-progress runs finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install accessibility test browser
        run: npx playwright install --with-deps chromium

      - name: Check HTML and accessibility before publishing
        run: npm run test:a11y

      - name: Save accessibility test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 14

      - name: Assemble site and compile Tailwind CSS
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp -r images _site/
          cp robots.txt sitemap.xml llms.txt _site/
          # CNAME is optional until a custom domain is chosen
          [ -f CNAME ] && cp CNAME _site/ || true
          touch _site/.nojekyll
          npx @tailwindcss/cli -i ./src/input.css -o ./_site/assets/tailwind.css --minify

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
