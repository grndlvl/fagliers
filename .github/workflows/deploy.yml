name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One production deploy at a time; let in-progress runs finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assemble site and compile Tailwind CSS
        run: |
          mkdir -p _site/alt-1/assets _site/alt-2/assets
          cp index.html _site/
          cp alt-1/index.html _site/alt-1/
          cp alt-2/index.html _site/alt-2/
          cp -r images _site/
          cp robots.txt _site/
          # CNAME is optional until a custom domain is chosen
          [ -f CNAME ] && cp CNAME _site/ || true
          touch _site/.nojekyll
          npx tailwindcss -c ./tailwind.alt-1.config.js -i ./src/alt-1.css -o ./_site/alt-1/assets/tailwind.css --minify
          npx tailwindcss -c ./tailwind.config.js -i ./src/input.css -o ./_site/alt-2/assets/tailwind.css --minify

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
